name: Update Cloudflare IP ranges

on:
  schedule:
    # Monthly, on the 1st. The script exits early when Cloudflare's API ETag is unchanged.
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cloudflare-ips
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Regenerate
        run: php tools/update-cloudflare-ip-validator.php

      - name: Validate
        run: |
          php -l src/CloudflareIpValidator.php
          php tests/live.php

      - name: Commit
        run: |
          if git diff --quiet -- src/CloudflareIpValidator.php; then
            echo "No changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/CloudflareIpValidator.php
          git commit -m 'Update Cloudflare IP ranges'
          git push
